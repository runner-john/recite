<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1f2329;
    --sub: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6fed;
    --accent-soft: #eaf1fe;
    --blank: #fde9d9;
    --blank-text: #b45309;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }

  /* 顶部 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
  }
  .topbar-inner { max-width: 980px; margin: 0 auto; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .logo { font-size: 17px; font-weight: 800; letter-spacing: .3px; }
  .logo .en { color: var(--accent); }
  .count-badge {
    font-size: 12px; color: var(--accent); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 12px; font-weight: 600; white-space: nowrap;
  }
  .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 12px; font-size: 14px;
    cursor: pointer; color: var(--sub); background: #f0f2f5; border: none; user-select: none;
    transition: all .18s; font-weight: 600; white-space: nowrap;
  }
  .tab:active { transform: scale(.96); }
  .tab.active { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(47,111,237,.28); }

  .container { max-width: 980px; margin: 20px auto; padding: 0 16px; }
  .section { display: none; }
  .section.active { display: block; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  .section-head { margin: 2px 0 18px; }
  .section-head h2 { font-size: 21px; margin-bottom: 4px; }
  .section-head p { font-size: 13px; color: var(--sub); }

  /* 进度条 */
  .progress-wrap { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; }
  .progress-bar { flex: 1; height: 6px; background: #e8ebf0; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #2f6fed, #5b8bff); border-radius: 3px; transition: width .3s; }
  .progress-label { font-size: 12px; color: var(--sub); white-space: nowrap; font-weight: 600; }

  /* 卡片 */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    transition: box-shadow .18s, transform .18s;
  }
  .card:active { transform: scale(.99); }
  .card.done { border-color: #bcd7ff; }
  .card-head {
    display: flex; align-items: center; gap: 12px; padding: 15px 18px; cursor: pointer; user-select: none;
  }
  .check {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid #cfd4dc; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
    transition: all .2s; cursor: pointer;
  }
  .card.done .check { background: #34c759; border-color: #34c759; }
  .card-title { font-size: 16px; font-weight: 700; flex: 1; }
  .card.done .card-title { color: #9aa3b0; text-decoration: line-through; }
  .card-tag {
    font-size: 11px; padding: 3px 10px; border-radius: 10px; background: var(--accent-soft);
    color: var(--accent); font-weight: 700; white-space: nowrap;
  }
  .chev { color: #b0b5bd; transition: transform .25s; font-size: 14px; flex-shrink: 0; }
  .card.open .chev { transform: rotate(180deg); }
  .card-body { padding: 0 18px 18px; display: none; }
  .card.open .card-body { display: block; }

  /* 语料库句子 */
  .sent {
    padding: 14px 16px; border-radius: 12px; background: #fafbfd; border: 1px solid var(--line);
    margin-bottom: 10px; position: relative; transition: all .18s; cursor: pointer;
  }
  .sent:active { background: #f0f4fb; }
  .sent.done { opacity: .55; }
  .sent .no {
    display: inline-block; color: var(--accent); font-weight: 800; margin-right: 8px; font-size: 14px;
  }
  .sent .en { font-size: 16px; font-weight: 700; }
  .sent.done .en { text-decoration: line-through; }

  /* 作文模板段落 */
  .block { margin-bottom: 12px; }
  .block-label {
    font-size: 12px; color: var(--sub); font-weight: 700; letter-spacing: .5px;
    margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
  }
  .block-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .block-text {
    font-size: 16px; font-weight: 700; background: #fafbfd; border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; white-space: pre-wrap;
  }
  .note {
    font-size: 13px; color: var(--sub); background: #fff8e6; border: 1px solid #f5e6b8;
    border-radius: 12px; padding: 11px 14px; margin: 6px 0 12px; line-height: 1.6;
  }

  /* 填空高亮（不再隐藏，仅高亮） */
  .b {
    background: var(--blank); color: var(--blank-text); padding: 1px 6px; border-radius: 6px;
    font-weight: 800;
  }

  /* 书信 */
  .letter { background: #fafbfd; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .letter p { margin-bottom: 9px; font-size: 16px; font-weight: 700; }
  .letter .sign { margin-top: 10px; color: var(--sub); font-style: italic; font-weight: 600; }

  .footer { text-align: center; color: #b0b5bd; font-size: 12px; padding: 26px 0 10px; }

  /* 安装提示 */
  .install-tip {
    display: none; align-items: center; gap: 10px; background: var(--accent); color: #fff;
    padding: 11px 16px; border-radius: 12px; margin: 0 0 18px; cursor: pointer; font-size: 14px;
    font-weight: 600; box-shadow: 0 4px 14px rgba(47,111,237,.3);
  }
  .install-tip.show { display: flex; }
  .install-tip:active { opacity: .85; }
  .install-tip .x { margin-left: auto; opacity: .8; font-size: 18px; line-height: 1; }

  @media (min-width: 640px) {
    .logo { font-size: 19px; }
  }
</style>

/* ================= 进度状态 ================= */
const KEY = 'recite_progress_v1';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ progress = {}; }
function saveProgress(){ localStorage.setItem(KEY, JSON.stringify(progress)); }

/* ================= 渲染工具 ================= */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderBlanks(text){
  let t = esc(text);
  t = t.replace(/【([^】]+)】/g, '<span class="b">$1</span>');
  t = t.replace(/\[([^\]]+)\]/g, '<span class="b">$1</span>');
  return t;
}

/* 语料库 */
const yuliaoBody = document.getElementById('yuliao-body');
yuliao.forEach((s, i) => {
  const key = 'y' + i;
  const div = document.createElement('div');
  div.className = 'sent' + (progress[key] ? ' done' : '');
  div.dataset.key = key;
  div.innerHTML = '<span class="no">' + (i+1) + '.</span><span class="en">' + renderBlanks(s) + '</span>';
  yuliaoBody.appendChild(div);
});

/* 大作文 */
const dazuowenBody = document.getElementById('dazuowen-body');
dazuowen.forEach((item, i) => {
  const key = 'd' + i;
  const card = document.createElement('div');
  card.className = 'card' + (progress[key] ? ' done' : '');
  card.dataset.key = key;
  let inner = '';
  item.sections.forEach(sec => {
    inner += '<div class="block"><div class="block-label">' + esc(sec.label) + '</div>';
    if (sec.note) inner += '<div class="note">' + esc(sec.note) + '</div>';
    inner += '<div class="block-text">' + renderBlanks(sec.text) + '</div></div>';
  });
  card.innerHTML =
    '<div class="card-head"><div class="check">✓</div><div class="card-title">' + esc(item.title) + '</div><div class="card-tag">' + esc(item.tag) + '</div><span class="chev">▾</span></div>' +
    '<div class="card-body">' + inner + '</div>';
  dazuowenBody.appendChild(card);
});

/* 小作文 */
const xiaozuowenBody = document.getElementById('xiaozuowen-body');
xiaozuowen.forEach((item, i) => {
  const key = 'x' + i;
  const card = document.createElement('div');
  card.className = 'card' + (progress[key] ? ' done' : '');
  card.dataset.key = key;
  let inner = '<div class="letter">';
  item.body.forEach(p => { inner += '<p>' + renderBlanks(p) + '</p>'; });
  inner += '</div>';
  card.innerHTML =
    '<div class="card-head"><div class="check">✓</div><div class="card-title">' + esc(item.title) + '</div><div class="card-tag">' + esc(item.tag) + '</div><span class="chev">▾</span></div>' +
    '<div class="card-body">' + inner + '</div>';
  xiaozuowenBody.appendChild(card);
});

/* ================= 交互 ================= */
/* 交互统一用事件委托：绑定在 document 上，不受 DOM 改写/克隆影响 */
document.addEventListener('click', (e) => {
  const check = e.target.closest('.check');
  if (check) {
    const card = check.closest('.card');
    if (card) toggleDone(card);
    return;
  }
  const sent = e.target.closest('.sent');
  if (sent) {
    toggleSent(sent);
    return;
  }
  const head = e.target.closest('.card-head');
  if (head) {
    head.parentElement.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.tab');
  if (tab) {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('s-' + tab.dataset.s).classList.add('active');
    return;
  }
});

function toggleDone(card){
  const key = card.dataset.key;
  progress[key] = !progress[key];
  card.classList.toggle('done', !!progress[key]);
  saveProgress();
  updateCount();
}
function toggleSent(sent){
  const key = sent.dataset.key;
  progress[key] = !progress[key];
  sent.classList.toggle('done', !!progress[key]);
  saveProgress();
  updateCount();
}

/* 进度统计 */
function updateCount(){
  const yl = yuliao.filter((_,i)=>progress['y'+i]).length;
  const dz = dazuowen.filter((_,i)=>progress['d'+i]).length;
  const xz = xiaozuowen.filter((_,i)=>progress['x'+i]).length;
  const total = yuliao.length + dazuowen.length + xiaozuowen.length;
  const doneTotal = yl + dz + xz;
  document.getElementById('countBadge').textContent = doneTotal + ' / ' + total + ' 已背';
  setBar('py', yl, yuliao.length, 'py-label');
  setBar('pd', dz, dazuowen.length, 'pd-label');
  setBar('px', xz, xiaozuowen.length, 'px-label');
}
function setBar(fillId, n, total, labelId){
  const pct = total ? Math.round(n/total*100) : 0;
  document.getElementById(fillId).style.width = pct + '%';
  document.getElementById(labelId).textContent = n + ' / ' + total;
}
updateCount();

/* ================= PWA 安装 ================= */
let deferredPrompt = null;
const installTip = document.getElementById('installTip');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installTip.classList.add('show');
});
installTip.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
  installTip.classList.remove('show');
});
document.getElementById('installClose').addEventListener('click', (e) => {
  e.stopPropagation();
  installTip.classList.remove('show');
});

/* 注册 service worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
